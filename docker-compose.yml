services:
  api_rewards:
    build:
      context: ./backend_app
      dockerfile: Dockerfile
    container_name: api_rewards
    restart: unless-stopped
    volumes:
      - ./backend_app:/app
      - ./backend_app/gunicorn.conf.py:/etc/nginx/gunicorn.conf.py
      - ./backend_app/static:/app/staticfiles
    ports:
      - "8002:8000"
    env_file:
      - ./backend_app/.env
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    driver: bridge