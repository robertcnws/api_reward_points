<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Pending approval for new user</title>
    <style>
      body,
      table,
      td,
      a {
        font-family: 'Open Sans', sans-serif;
        color: #333333;
      }

      body {
        background-color: #f8f8f8;
      }

      a {
        color: #669a41;
        text-decoration: none;
      }

      p {
        font-size: 14px;
        line-height: 1.5;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: #333333;
        line-height: 1.2;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }

      .header,
      .footer {
        background-color: #ffffff;
      }

      .header {
        padding: 20px;
        text-align: center;
      }

      .footer {
        padding: 20px;
        text-align: center;
        font-size: 12px;
      }

      .content {
        background-color: #ffffff;
        padding: 20px;
      }

      .button {
        display: inline-block;
        padding: 15px 25px;
        background-color: #669a41;
        color: #ffffff;
        border-radius: 5px;
        text-align: center;
      }

      .button:hover {
        background-color: #567a33;
      }
    </style>
  </head>
  <body style="font-family: 'Open Sans', sans-serif; color: #333333; background-color: #f8f8f8">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px">
      <div style="background-color: #669a41; color: #ffffff; text-align: center; padding: 20px">
        <h1 style="color: #ffffff; line-height: 1.2">New Window System Customer Portal</h1>
      </div>
      <div style="background-color: #ffffff; color: #333333; padding: 20px">
        <p style="font-size: 14px; line-height: 1.5">Hello Administrator</p>
        <p style="font-size: 14px; line-height: 1.5">
          You have a pending approval for new verified user <br/><br/>
          <strong>{{ username }}</strong> ({{ first_name }} {{ last_name }})<br/>
          With <strong>{{ points }}</strong> reward points.<br/>
          <br/>
          Please sign in to the NWS Reward Points Portal and proceed to APPROVE.
        </p>
        <p style="font-size: 14px; line-height: 1.5">Best regards,</p>
        <p style="font-size: 14px; line-height: 1.5">Your NWS Team</p>
      </div>
    </div>
  </body>
</html>
